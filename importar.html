<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importar QR Codes - Sedex do Açaí</title>
<style>
body{font-family:Arial,sans-serif;background:#4b1a8f;color:#fff;margin:0;padding:24px;text-align:center}
.card{background:#fff;color:#2b0f57;border-radius:16px;padding:20px;max-width:420px;margin:20px auto}
button{background:#ffd400;color:#2b0f57;border:0;border-radius:12px;padding:16px 20px;font-size:18px;font-weight:bold;width:100%;margin-top:12px}
input{width:100%;box-sizing:border-box;padding:14px;font-size:16px;border-radius:10px;border:2px solid #4b1a8f;margin-top:8px}
#log{margin-top:16px;font-size:15px;white-space:pre-wrap;text-align:left}
</style>
</head>
<body>
<div class="card">
<h2>Importar os 60 QR Codes</h2>
<p>Grava os 60 QR Codes no banco. Use uma vez só.</p>
<input id="chave" type="password" inputmode="numeric" placeholder="Chave de importação (4 dígitos)">
<button id="btn">Importar 60 QR Codes</button>
<div id="log"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAKWGI3yk5WOU8rQit5TAfxU1jUX1mUTpc",
  authDomain: "sedex-do-acai-fidelidade.firebaseapp.com",
  projectId: "sedex-do-acai-fidelidade",
  messagingSenderId: "1067708455298",
  appId: "1:1067708455298:web:4d5165eeb7eb2f4c57d79b"
};
const db = getFirestore(initializeApp(firebaseConfig));
const QRS = [[1, "QR-2HW83Q4S"], [2, "QR-7X96FMV6"], [3, "QR-6NR59JRQ"], [4, "QR-Q9MXP996"], [5, "QR-PW8KLVW9"], [6, "QR-274YNRAC"], [7, "QR-LEJ3SAY7"], [8, "QR-6EJTGR7D"], [9, "QR-WLHAL7KX"], [10, "QR-UE49Y5MM"], [11, "QR-583XY82Q"], [12, "QR-W6D84YXE"], [13, "QR-2CV3WUVX"], [14, "QR-3WCCZKRX"], [15, "QR-E2UDKSCZ"], [16, "QR-8QTJWQPE"], [17, "QR-PCPQVGCT"], [18, "QR-EBMVGT2V"], [19, "QR-PJYLS28A"], [20, "QR-TFNLLHXE"], [21, "QR-YXFDGTWG"], [22, "QR-5SQ4X7NU"], [23, "QR-9Q2QY6LL"], [24, "QR-EA4MKMSC"], [25, "QR-4PNNXJND"], [26, "QR-3KNXRRYE"], [27, "QR-NVWSHCR8"], [28, "QR-WJYJQDXK"], [29, "QR-W3RE8Y77"], [30, "QR-VRBKAK47"], [31, "QR-RXS8CXNX"], [32, "QR-5CFAZ6QU"], [33, "QR-P3XJLJCC"], [34, "QR-X932LBEU"], [35, "QR-E2JZU9NL"], [36, "QR-Z6MZLEKD"], [37, "QR-DP9LHLYR"], [38, "QR-RB2RC3W8"], [39, "QR-P7UJYCSU"], [40, "QR-GPCBS23L"], [41, "QR-ZZRV2AUN"], [42, "QR-DWP4XLNJ"], [43, "QR-DJ4V7DNV"], [44, "QR-QHSCU8SF"], [45, "QR-4V2BRJA3"], [46, "QR-YNB836V4"], [47, "QR-FC9KABQB"], [48, "QR-BTL3TSLS"], [49, "QR-KVXDJWWS"], [50, "QR-XC59D9GT"], [51, "QR-9WLPEBF9"], [52, "QR-TQT5DYAM"], [53, "QR-JWEDB7FY"], [54, "QR-JA4X5XTU"], [55, "QR-YHCZCNW9"], [56, "QR-H6SUSGSK"], [57, "QR-LVHP459E"], [58, "QR-6V8UNTPQ"], [59, "QR-4WEDALJF"], [60, "QR-CYBLSGXP"]];
const log = t => { document.getElementById('log').textContent += t + "\n"; };

document.getElementById('btn').onclick = async () => {
  const chave = document.getElementById('chave').value.trim();
  if(!chave){ log("Digite a chave primeiro."); return; }
  const btn = document.getElementById('btn');
  btn.disabled = true;
  try{
    const b = writeBatch(db);
    QRS.forEach(([n,c])=>{ b.set(doc(db,'qrs',c),{chave:chave,numero:n}); });
    await b.commit();
    log("Pronto! Os 60 QR Codes foram importados.");
  }catch(e){
    log("Erro: " + e.message);
    btn.disabled = false;
  }
};
</script>
</body>
</html>
